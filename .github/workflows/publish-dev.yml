name: publish-dev

on:
  workflow_dispatch:

jobs:
  main:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          registry-url: 'https://registry.npmjs.org'
      # See publish.yml: the npm that `pnpm publish` shells out to is what
      # performs the OIDC exchange, and Node 22's bundled npm is too old.
      - run: npm install -g npm@12.0.2
      - run: pnpm install --frozen-lockfile

      - name: Prepare
        run: |
          ./script/bump dev
      - run: pnpm build

      # No NODE_AUTH_TOKEN -- trusted publishing. See publish.yml.
      - name: Publish packages
        run: pnpm publish --tag dev --recursive --access public --no-git-checks
        env:
          NPM_CONFIG_PROVENANCE: true
